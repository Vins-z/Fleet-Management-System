version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fleet_postgres
    restart: always
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://fleet_user:fleet_password@postgres:5432/fleet_db
      - SECRET_KEY=fleet-enterprise-production-key
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fleet_network

volumes:
  postgres_data:
    driver: local

networks:
  fleet_network:
    driver: bridge
