name: Continuous Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Container Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub (if credentials configured)
      if: "${{ env.DOCKER_USERNAME != '' }}"
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t fleet-backend:latest ./backend

    - name: Build Frontend Image
      run: |
        docker build -t fleet-frontend:latest ./frontend

    - name: Deploy via SSH (if server secrets configured)
      if: "${{ env.SERVER_IP != '' }}"
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/fleet-management || exit 1
          docker compose down
          docker compose up -d --build
